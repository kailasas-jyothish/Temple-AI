<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temple AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 3 5 12h3v15h16V12h3z' fill='%23c2661b'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Temple AI</h1>
      <p class="sub" id="summary">Checking services…</p>
    </div>
    <button type="button" id="refresh" class="refresh">Check now</button>
  </header>

  <main id="grid" class="grid" aria-live="polite"></main>

  <footer class="foot" id="foot"></footer>

  <template id="card">
    <article class="card">
      <div class="card-head">
        <span class="dot" aria-hidden="true"></span>
        <h2 class="name"></h2>
        <span class="state"></span>
      </div>
      <p class="desc"></p>
      <dl class="facts"></dl>
      <ul class="problems"></ul>
      <div class="items">
        <h3 class="items-label"></h3>
        <ul class="items-list"></ul>
      </div>
      <div class="card-foot">
        <span class="meta"></span>
        <a class="open" target="_blank" rel="noopener">Open</a>
      </div>
    </article>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
