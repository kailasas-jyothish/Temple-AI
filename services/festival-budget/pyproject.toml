[project]
name = "temple-festival-budget"
version = "0.1.0"
description = "Festival budgets: ritual and fruit requirements from a reusable ritual library, stock deducted, vendor rates, written to a Google Sheet"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "google-auth>=2.62.0",
    "requests>=2.34.2",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
# An application, not a library: nothing to build or install, uv only manages
# the environment and the lockfile.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
