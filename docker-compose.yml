# Local / plain-Docker runs of the whole app. On Dokploy each service is its own
# application built from the same repo, with env vars and volumes set there (or
# via scripts/dokploy.mjs).
#
# Each service's build context is its own directory, matching what Dokploy does
# with the Dockerfile path — it resolves the context from the Dockerfile's
# location, so a local build here proves the same thing the hosted build will do.
services:
  notifier:
    build:
      context: services/notifier
    restart: unless-stopped
    env_file: services/notifier/.env
    environment:
      DATA_DIR: /data
    ports:
      - "3000:3000"
    volumes:
      - notifier-data:/data

  reels:
    build:
      context: services/reels
    restart: unless-stopped
    env_file: services/reels/.env
    environment:
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - reels-data:/data

  panchaloha:
    build:
      context: services/panchaloha
    restart: unless-stopped
    env_file: services/panchaloha/.env
    ports:
      - "3100:3100"

  youtube:
    build:
      context: services/youtube
    restart: unless-stopped
    env_file: services/youtube/.env
    environment:
      # Local runs use the default compose bridge, not temple-ai-internal.
      ALLOWED_SOURCES: 172.16.0.0/12
    # WireGuard runs inside the container; these two are all it needs.
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    # Internal API: other services call http://youtube:8090. Loopback only.
    ports:
      - "127.0.0.1:8090:8090"

volumes:
  notifier-data:
  reels-data:
