# Local / plain-Docker runs of the whole app. On Dokploy each service is its own
# application built from the same repo, with env vars and volumes set there (or
# via scripts/dokploy.mjs).
#
# The build context is the repo root for both services, matching Dokploy's
# customGitBuildPath of '/', so the Dockerfiles address their own files by full
# path and a local build proves the same thing the hosted build will do.
services:
  notifier:
    build:
      context: .
      dockerfile: services/notifier/Dockerfile
    restart: unless-stopped
    env_file: services/notifier/.env
    environment:
      DATA_DIR: /data
    ports:
      - "3000:3000"
    volumes:
      - notifier-data:/data

  reels:
    build:
      context: .
      dockerfile: services/reels/Dockerfile
    restart: unless-stopped
    env_file: services/reels/.env
    environment:
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - reels-data:/data

volumes:
  notifier-data:
  reels-data:
